name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Check site files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files exist
        run: |
          test -f index.html || (echo "index.html missing" && exit 1)
          test -f style.css  || (echo "style.css missing" && exit 1)
          test -f script.js  || (echo "script.js missing" && exit 1)
          echo "All required files found"
      - name: Basic HTML check
        run: |
          grep -q "<html" index.html || (echo "index.html looks invalid" && exit 1)
          echo "HTML check passed"

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
